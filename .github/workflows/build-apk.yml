name: Build Android APK

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        continue-on-error: true

      - name: Create Release Info
        run: |
          echo "# APK Build Info" > build-info.txt
          echo "" >> build-info.txt
          echo "**Build Date:** $(date)" >> build-info.txt
          echo "**Commit:** ${{ github.sha }}" >> build-info.txt
          echo "**Branch:** ${{ github.ref_name }}" >> build-info.txt
          echo "" >> build-info.txt
          echo "## Archivos generados:" >> build-info.txt
          echo "- app-debug.apk (Listo para instalar)" >> build-info.txt
          ls -lh android/app/build/outputs/apk/debug/ >> build-info.txt || true

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
