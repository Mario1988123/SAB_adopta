<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1976d2"/>

  <!-- Person silhouette -->
  <circle cx="256" cy="180" r="60" fill="white"/>
  <path d="M256 260c-60 0-110 40-110 90v40h220v-40c0-50-50-90-110-90z" fill="white"/>

  <!-- Paw print -->
  <g transform="translate(320, 320)">
    <!-- Main pad -->
    <ellipse cx="0" cy="20" rx="35" ry="40" fill="white"/>
    <!-- Top left toe -->
    <ellipse cx="-30" cy="-10" rx="18" ry="25" transform="rotate(-20 -30 -10)" fill="white"/>
    <!-- Top center toe -->
    <ellipse cx="-5" cy="-20" rx="18" ry="25" transform="rotate(-5 -5 -20)" fill="white"/>
    <!-- Top right toe -->
    <ellipse cx="20" cy="-15" rx="18" ry="25" transform="rotate(15 20 -15)" fill="white"/>
    <!-- Right toe -->
    <ellipse cx="35" cy="5" rx="18" ry="25" transform="rotate(30 35 5)" fill="white"/>
  </g>
</svg>
